[project]
name = "receipter"
version = "0.1.0"
description = "Local image-printing lab for an Epson TM-U220 impact receipt printer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "python-escpos==3.1",
    "python-multipart>=0.0.32",
    "pyusb>=1.3.1",
    "uvicorn[standard]>=0.52.4",
]
