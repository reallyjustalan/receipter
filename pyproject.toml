[project]
name = "receipter"
version = "0.1.0"
description = "Local photo-booth receipt builder for an Epson TM-U220 impact printer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "python-escpos==3.1",
    "python-multipart>=0.0.32",
    "pyusb>=1.3.1",
    "resvg-py>=0.5.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",
]
